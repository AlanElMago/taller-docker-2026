services:
  webapp:
    build: ./webapp
    image: mi-webapp:latest
    container_name: mi-webapp
    ports:
      - 80:5000
    networks:
      - mi-red
    depends_on:
      - redis
    # volumes:
    #   - ./webapp/static:/app/static
    #   - ./webapp/templates:/app/templates
    # environment:
    #   - REDIS_HOST=redis
    #   - REDIS_PORT=6379

  redis:
    image: redis:7-alpine
    container_name: mi-redis
    networks:
      - mi-red
    volumes:
      - redis-data:/data

networks:
  mi-red:
    driver: bridge

